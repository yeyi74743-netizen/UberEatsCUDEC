<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>Pedidos - YEYIFOOD</title>

  <!-- Materialize -->
  <link type="text/css"
        href="../css/materialize.min.css"
        rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

  <!-- Estilos -->
  <link type="text/css"
        href="../css/styles.css"
        rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <style>
    #mapa {
      height: 180px;
      margin-top: 20px;
    }

    #btnUbicacion {
      margin-top: 20px;
    }
  </style>

</head>

<body class="grey lighten-4">

  <!-- Top nav -->
  <nav class="z-depth-0">

    <div class="nav-wrapper container">

      <a href="../">
        YEYIFOOD
      </a>

      <span class="right grey-text text-darken-1">

        <i class="material-icons sidenav-trigger"
           data-target="side-menu">
          menu
        </i>

      </span>

    </div>

  </nav>

  <!-- Side nav -->
  <ul id="side-menu"
      class="sidenav side-menu">

    <li>
      <a class="subheader">
        YEYIFOOD
      </a>
    </li>

    <li>
      <a href="../"
         class="waves-effect">
        Home
      </a>
    </li>

    <li>
      <a href="./pedidos.html"
         class="waves-effect">
        Pedidos
      </a>
    </li>

    <li>
      <a href="./about.html"
         class="waves-effect">
        About
      </a>
    </li>

    <li>
      <div class="divider"></div>
    </li>

    <li>

      <a href="./contact.html"
         class="waves-effect">

        <i class="material-icons">
          mail_outline
        </i>

        Contact

      </a>

    </li>

  </ul>

  <!-- Content -->
  <div class="container grey-text">

    <h5 class="center">
      Nuevo Pedido
    </h5>

    <form id="form-pedido"
          style="margin-top: 30px;">

      <!-- Platillos -->
      <div class="input-field">

        <select id="listaPlatillos">

          <option value=""
                  disabled
                  selected>
            Selecciona un platillo
          </option>

        </select>

        <label>
          Platillo
        </label>

      </div>

      <!-- Cliente -->
      <div class="input-field">

        <input placeholder="Nombre del Cliente"
               id="Cliente"
               type="text"
               class="validate"
               required>

        <label for="Cliente">
          Cliente
        </label>

      </div>

      <!-- Dirección -->
      <div class="input-field">

        <input placeholder="Dirección de entrega"
               id="direccion"
               type="text"
               class="validate"
               required>

        <label for="direccion">
          Dirección
        </label>

      </div>

      <!-- Botones -->
      <div class="input-field center">

        <button type="submit"
                class="btn-small green">

          Guardar

        </button>

        <a href="../"
           class="btn-small red">

          Cancelar

        </a>

      </div>

    </form>

    <!-- Ubicación -->
    <div class="center">

      <button id="btnUbicacion"
              type="button"
              class="btn blue">

        <i class="material-icons left">
          location_on
        </i>

        Ubicación

      </button>

    </div>

    <!-- Mapa -->
    <div id="mapa"></div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- Materialize -->
  <script src="../js/materialize.min.js"></script>

  <!-- Proyecto -->
  <script src="../js/firebase.js"></script>
  <script src="../js/pedidos.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const menus = document.querySelectorAll(".sidenav");
      M.Sidenav.init(menus);

      const selects = document.querySelectorAll("select");
      M.FormSelect.init(selects);
    });
  </script>

</body>

</html>
